name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Official release tag of TanCan1998/Soxu (v<version> or refs/tags/v<version>)'
        required: true
        type: string
      version:
        description: 'Semantic version without v prefix (e.g. 0.1.0)'
        required: true
        type: string
      publish:
        description: 'Publish GitHub release & update manifests (false = dry-run build)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve & Verify Release Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
    steps:
      - name: Validate tag/version input allowlist
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_PUBLISH: ${{ github.event.client_payload.publish }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            raw_ref="$PAYLOAD_REF"
            raw_version="$PAYLOAD_VERSION"
            if [ "$PAYLOAD_PUBLISH" = "false" ]; then
              should_publish="false"
            else
              should_publish="true"
            fi
          else
            raw_ref="$INPUT_REF"
            raw_version="$INPUT_VERSION"
            if [ "$INPUT_PUBLISH" = "true" ]; then
              should_publish="true"
            else
              should_publish="false"
            fi
          fi

          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version: '$raw_version'"
            exit 1
          fi

          expected_tag="v$version"
          expected_ref="refs/tags/$expected_tag"
          norm_ref="${raw_ref#refs/tags/}"
          if [ "$raw_ref" != "$expected_tag" ] && [ "$raw_ref" != "$expected_ref" ]; then
            echo "::error::Unauthorized ref '$raw_ref' for version '$version'; only '$expected_tag' or '$expected_ref' is permitted."
            exit 1
          fi
          if [ "$norm_ref" != "$expected_tag" ]; then
            echo "::error::Normalized ref mismatch: '$norm_ref' != '$expected_tag'"
            exit 1
          fi

          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "ref=$expected_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Checkout official release tag metadata (sparse, no credentials persisted)
        uses: actions/checkout@v7
        with:
          repository: TanCan1998/Soxu
          ssh-key: ${{ secrets.SOXU_DEPLOY_KEY }}
          ref: ${{ steps.validate.outputs.ref }}
          path: upstream
          sparse-checkout: mise.toml
          fetch-depth: 1
          persist-credentials: false

      - name: Pin resolved upstream commit SHA
        id: resolve
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          REF: ${{ steps.validate.outputs.ref }}
          VERSION: ${{ steps.validate.outputs.version }}
          SHOULD_PUBLISH: ${{ steps.validate.outputs.should_publish }}
        run: |
          set -euo pipefail
          commit_sha=$(git -C upstream rev-parse --verify "HEAD^{commit}")
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Failed to resolve 40-char commit SHA for $REF (got '$commit_sha')"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Pinned release tag $REF -> $commit_sha (version=$VERSION, should_publish=$SHOULD_PUBLISH)"

  linux:
    needs: resolve
    name: Build & Smoke Test (linux-amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned source commit (no credentials persisted)
        uses: actions/checkout@v7
        with:
          repository: TanCan1998/Soxu
          ssh-key: ${{ secrets.SOXU_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify checked-out commit SHA matches resolved tag
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          [ "$actual_sha" = "$EXPECTED_SHA" ] || { echo "::error::SHA mismatch: $actual_sha != $EXPECTED_SHA"; exit 1; }

      - name: Install Linux build dependencies (with mirror fallback)
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            if [ "$i" = 2 ]; then
              m=http://mirrors.edge.kernel.org/ubuntu
              echo "Switching apt mirror to $m"
              sudo sed -i -E "s#https?://[^ ]*(archive|security)\.ubuntu\.com/ubuntu#$m#g" /etc/apt/sources.list || true
              sudo find /etc/apt/sources.list.d -name '*.sources' -exec sed -i -E "s#https?://[^ ]*(archive|security)\.ubuntu\.com/ubuntu#$m#g" {} + || true
              if [ -f /etc/apt/apt-mirrors.txt ]; then echo "$m" | sudo tee /etc/apt/apt-mirrors.txt; fi
            fi
            sudo timeout 300 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 &&
              sudo timeout 300 apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 build-essential pkg-config libssl-dev curl && exit 0
            echo "apt attempt $i failed; retrying..."
            sleep 10
          done
          exit 1

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build Mobile Web assets if present
        run: |
          if [ -f apps/mobile-web/package.json ]; then
            pnpm -C apps/mobile-web install --frozen-lockfile
            pnpm -C apps/mobile-web run build
          fi

      - name: Build release binaries
        run: cargo build --release --locked -p soxu-cli -p soxu-daemon

      - name: Live binary & daemon smoke test
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'pkill -f "$tmp" || true; rm -rf "$tmp"' EXIT
          target/release/soxu --version
          export HOME="$tmp/home"
          mkdir -p "$HOME"
          export SOXU_DATA_DIR="$tmp/data"
          export SOXU_LISTEN="127.0.0.1:17698"
          target/release/soxu-daemon > "$tmp/daemon.log" 2>&1 &
          dpid=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS http://127.0.0.1:17698/api/health >/dev/null 2>&1; then
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then
            cat "$tmp/daemon.log" || true
            echo "::error::soxu-daemon did not answer /api/health"
            exit 1
          fi
          target/release/soxu --addr http://127.0.0.1:17698 status --json
          kill "$dpid" || true
          wait "$dpid" || true

      - name: Package linux-amd64 archive
        run: |
          mkdir -p dist/stage
          cp target/release/soxu target/release/soxu-daemon dist/stage/
          tar -C dist/stage -czf dist/soxu-linux-amd64.tar.gz soxu soxu-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: build-linux-amd64
          path: dist/soxu-linux-amd64.tar.gz
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: resolve
    name: Build & Smoke Test (windows-amd64)
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned source commit (no credentials persisted)
        uses: actions/checkout@v7
        with:
          repository: TanCan1998/Soxu
          ssh-key: ${{ secrets.SOXU_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify checked-out commit SHA matches resolved tag
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "SHA mismatch: $actual != $env:EXPECTED_SHA" }

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build Mobile Web assets if present
        shell: pwsh
        run: |
          if (Test-Path apps/mobile-web/package.json) {
            pnpm -C apps/mobile-web install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pnpm -C apps/mobile-web run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build release binaries
        run: cargo build --release --locked -p soxu-cli -p soxu-daemon

      - name: Live binary & daemon smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & target/release/soxu.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tmp = Join-Path $env:RUNNER_TEMP ("soxu-smoke-" + [Guid]::NewGuid().ToString('N'))
          $data = Join-Path $tmp 'data'
          $homeDir = Join-Path $tmp 'home'
          New-Item -ItemType Directory -Path $data, $homeDir | Out-Null
          $env:USERPROFILE = $homeDir
          $env:SOXU_DATA_DIR = $data
          $env:SOXU_LISTEN = '127.0.0.1:17698'
          $logOut = Join-Path $tmp 'daemon.out.log'
          $logErr = Join-Path $tmp 'daemon.err.log'
          $proc = Start-Process -FilePath (Resolve-Path 'target/release/soxu-daemon.exe').Path -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "soxu-daemon exited early with $($proc.ExitCode)" }
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:17698/api/health' -UseBasicParsing | Out-Null
                $ok = $true
                break
              } catch {}
            }
            if (-not $ok) {
              Get-Content $logOut, $logErr -ErrorAction SilentlyContinue
              throw 'soxu-daemon never answered /api/health'
            }
            & target/release/soxu.exe --addr http://127.0.0.1:17698 status --json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Package windows-amd64 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/stage -Force | Out-Null
          Copy-Item target/release/soxu.exe, target/release/soxu-daemon.exe dist/stage/
          Compress-Archive -Path dist/stage/soxu.exe, dist/stage/soxu-daemon.exe -DestinationPath dist/soxu-windows-amd64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: build-windows-amd64
          path: dist/soxu-windows-amd64.zip
          retention-days: 1
          if-no-files-found: error

  macos:
    needs: resolve
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            smoke: true
            label: Build & Native Smoke Test (darwin-arm64 on macos-15)
          - target: x86_64-apple-darwin
            arch: amd64
            smoke: false
            label: Cross-Compile on arm64 Host (darwin-amd64, no native Intel smoke)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout pinned source commit (no credentials persisted)
        uses: actions/checkout@v7
        with:
          repository: TanCan1998/Soxu
          ssh-key: ${{ secrets.SOXU_DEPLOY_KEY }}
          ref: ${{ needs.resolve.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify checked-out commit SHA matches resolved tag
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          [ "$actual_sha" = "$EXPECTED_SHA" ] || { echo "::error::SHA mismatch: $actual_sha != $EXPECTED_SHA"; exit 1; }

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build Mobile Web assets if present
        run: |
          if [ -f apps/mobile-web/package.json ]; then
            pnpm -C apps/mobile-web install --frozen-lockfile
            pnpm -C apps/mobile-web run build
          fi

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p soxu-cli -p soxu-daemon

      - name: Live binary smoke test (native arm64 host only)
        if: matrix.smoke
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          BIN_DIR="target/${{ matrix.target }}/release"
          "$BIN_DIR/soxu" --version
          export HOME="$tmp/home"
          mkdir -p "$HOME"
          export SOXU_DATA_DIR="$tmp/data"
          export SOXU_LISTEN="127.0.0.1:17698"
          "$BIN_DIR/soxu-daemon" > "$tmp/daemon.log" 2>&1 &
          dpid=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS http://127.0.0.1:17698/api/health >/dev/null 2>&1; then
              ok=1
              break
            fi
          done
          [ "$ok" = "1" ] || { cat "$tmp/daemon.log" || true; exit 1; }
          "$BIN_DIR/soxu" --addr http://127.0.0.1:17698 status --json
          kill "$dpid" || true
          wait "$dpid" || true

      - name: Record cross-compile notice (amd64)
        if: "!matrix.smoke"
        run: |
          echo "darwin-amd64 archive was cross-compiled for x86_64-apple-darwin on arm64 macos-15 host without native Intel execution."

      - name: Package darwin archive
        run: |
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/soxu" "target/${{ matrix.target }}/release/soxu-daemon" dist/stage/
          tar -C dist/stage -czf "dist/soxu-darwin-${{ matrix.arch }}.tar.gz" soxu soxu-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: build-darwin-${{ matrix.arch }}
          path: dist/soxu-darwin-${{ matrix.arch }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Checksums, Provenance, Publish & Update Manifests
    needs: [resolve, linux, windows, macos]
    if: needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    env:
      REF: ${{ needs.resolve.outputs.ref }}
      VERSION: ${{ needs.resolve.outputs.version }}
      COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Download expected platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify allowlisted release assets & generate SHA256SUMS
        run: |
          set -euo pipefail
          expected=(
            soxu-linux-amd64.tar.gz
            soxu-windows-amd64.zip
            soxu-darwin-arm64.tar.gz
            soxu-darwin-amd64.tar.gz
          )
          for f in "${expected[@]}"; do
            test -s "dist/$f" || { echo "::error::Missing expected release archive dist/$f"; exit 1; }
          done
          extra=$(find dist -maxdepth 1 -type f ! -name 'soxu-linux-amd64.tar.gz' ! -name 'soxu-windows-amd64.zip' ! -name 'soxu-darwin-arm64.tar.gz' ! -name 'soxu-darwin-amd64.tar.gz')
          if [ -n "$extra" ]; then
            echo "::error::Unexpected files in dist/: $extra"
            exit 1
          fi
          (
            cd dist
            sha256sum soxu-linux-amd64.tar.gz soxu-windows-amd64.zip soxu-darwin-arm64.tar.gz soxu-darwin-amd64.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
            ls -la
          )

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Decide monotonic Latest mark
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make=$(bash scripts/latest.sh is-newest "$GITHUB_REPOSITORY" "v$VERSION")
          echo "make=$make" >> "$GITHUB_OUTPUT"

      - name: Create Release draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Soxu v${{ env.VERSION }}
          draft: true
          make_latest: ${{ steps.latest.outputs.make }}
          generate_release_notes: true
          files: dist/*

      - name: Publish Release & verify monotonic Latest
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE: ${{ steps.latest.outputs.make }}
        run: |
          gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --draft=false --latest="$MAKE"
          bash scripts/latest.sh mark "$GITHUB_REPOSITORY"

      - name: Update Scoop, Homebrew & Winget manifests
        if: startsWith(needs.resolve.outputs.ref, 'refs/tags/v') && steps.latest.outputs.make == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/update-manifests.sh "$VERSION" dist/SHA256SUMS
          git add bucket Formula winget
          if git diff --cached --quiet; then
            echo "Manifests already up to date for v$VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update scoop, homebrew and winget manifests for v$VERSION"
          auth_b64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_b64" push origin HEAD:main
